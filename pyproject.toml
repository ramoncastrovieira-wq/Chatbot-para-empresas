[tool.poetry]
name = "chatbot-empresas"
version = "2.0.1"
description = "HUB de atendimento WhatsApp em Python 3.12 com FastAPI, PostgreSQL e base para IA."
authors = ["Tico Auto Peças"]
readme = "README.md"
packages = [{include = "src_py"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "0.104.1"
uvicorn = {extras = ["standard"], version = "0.24.0"}
sqlalchemy = "2.0.23"
psycopg[binary] = "2.9.9"
pydantic = "2.5.0"
pydantic-settings = "2.1.0"
email-validator = "2.3.0"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
python-multipart = "0.0.6"
python-dotenv = "1.0.0"
httpx = "0.25.1"
websockets = "12.0"
aiohttp = "3.9.1"
langchain = "0.1.0"
langchain-openai = "0.0.5"
langgraph = "0.0.17"
langchain-community = "0.0.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.12.0"
ruff = "^0.1.9"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
